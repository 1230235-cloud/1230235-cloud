
name: Generar serpiente de contribuciones

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generar animación Snake
        uses: Platane/snk@v3
        with:
          github_user_name: 1230235-cloud
          outputs: |
            dist/github-snake.svg?color_snake=%2334d399&color_dots=%230d1117,%23064e3b,%23059669,%2310b981,%2334d399
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2334d399&color_dots=%230d1117,%23064e3b,%23059669,%2310b981,%2334d399

      - name: Publicar archivos generados
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
